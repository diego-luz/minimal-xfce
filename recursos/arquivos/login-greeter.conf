# Escrito pelo d3bian-init-minimal-xfce. Fica numa pasta .conf.d para que o arquivo
# principal /etc/lightdm/lightdm-gtk-greeter.conf continue livre para ajuste manual.
[greeter]
theme-name=d3bian-minimal-login
icon-theme-name=@@login_icones@@
# o cursor fica o do sistema: este projeto nao troca o cursor
font-name=@@fonte_ui@@ 11
background=@@login_raiz@@/fundo.jpg
user-background=false
# a foto e desenhada pelo tema, acima dos campos; ver o comentario no gtk.css
hide-user-image=true
indicators=~spacer;~session;~a11y;~clock;~power
clock-format=%a %d %b  %H:%M
# na tela de bloqueio, apaga o monitor depois de um minuto sem mexer
screensaver-timeout=60
