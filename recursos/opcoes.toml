ajuda = "Docklike agrupa por programa e aceita fixar (para mudar a ordem dos icones, segure Ctrl, clique no icone, solte o Ctrl e arraste ate o lugar; o botao do meio (ou Shift + clique) abre outra janela do programa); Botoes e o padrao do Xfce"
grupo = "Barra"
nomes = { docklike = "Docklike, so icones", botoes = "Botoes de janela", nenhuma = "Nenhuma" }
exemplos = { "docklike" = "barra_tarefas-docklike.png", "botoes" = "barra_tarefas-botoes.png", "nenhuma" = "barra_tarefas-nenhuma.png" }


