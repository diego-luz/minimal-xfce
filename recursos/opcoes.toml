# Preferencias que a pagina de Ajustes desenha e que as receitas usam.
#
# O projeto so usa o que vem no repositorio do Debian: tema Orchis, icones
# Papirus ou Numix, a barra do proprio Xfce e o papel de parede gerado aqui.
# Nada e clonado nem compilado, e por isso o desfazer e simples.

[[opcao]]
chave = "modo"
padrao = "escuro"
valores = ["escuro", "claro"]
titulo = "Claro ou escuro"
ajuda = "Vale para as janelas, os icones e o papel de parede"
grupo = "Visual"
nomes = { escuro = "Escuro", claro = "Claro" }
exemplos = { "escuro" = "modo-escuro.png", "claro" = "modo-claro.png" }


[[opcao]]
chave = "compacto"
padrao = "sim"
valores = ["sim", "nao"]
titulo = "Barras de titulo estreitas"
ajuda = "A variante compacta do Orchis: menos altura e menos espaco vazio"
grupo = "Visual"
exemplos = { "sim" = "compacto-sim.png", "nao" = "compacto-nao.png" }


