titulo = "Onde fica a barra"
ajuda = "Uma barra so, colada na borda; ou em ilhas: barra fina solta no topo e as janelas abertas numa ilha embaixo, com cantos redondos"
grupo = "Barra"
nomes = { topo = "No topo", baixo = "Embaixo", ilhas = "Em ilhas" }
exemplos = { "topo" = "barra-topo.png", "baixo" = "barra-baixo.png", "ilhas" = "barra-ilhas.png" }


[[opcao]]
chave = "barra_tarefas"
